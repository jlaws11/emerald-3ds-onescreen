name: Clean up releases

# Deletes the releases (and their tags) listed in .github/cleanup-releases.txt,
# one tag a line: temporary ones such as the encrypted recipe inputs.
on:
  push:
    branches: [main]
    paths: [.github/cleanup-releases.txt]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the listed releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -v '^\s*\(#\|$\)' .github/cleanup-releases.txt | while read -r tag; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes --cleanup-tag && echo "deleted $tag"
            else
              echo "no release $tag"
            fi
          done
