name: Single screen release

# Builds the engine-only Emerald3DS.3dsx for the single-screen branch in the
# same pinned environment as an official release (tools/release_env, from
# upstream.lock), checks its data ABI against the official release it is based
# on (so an existing emerald3ds.pak keeps working), and publishes it as a
# GitHub release of this fork. No ROM is used or shipped.

on:
  push:
    branches: [main]
    # Changes to the docs, the README or the other workflows alone do not
    # rebuild the game; a new key for the recipe inputs (.github/pack-inputs.pub.pem)
    # or a change to this workflow does.
    paths-ignore: ['docs/**', 'README.md', '.github/payload/**', '.github/cleanup-releases.txt',
                   '.github/workflows/builder-appimage.yml', '.github/workflows/cleanup-releases.yml',
                   '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: single-screen-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_RELEASE: v0.5.0
      UPSTREAM: ZallaxDev/emerald-3ds
    steps:
      - uses: actions/checkout@v4

      - name: Release environment image
        run: |
          read PY_IMAGE PILLOW DKA_IMAGE < <(python3 - <<'EOF'
          import tomllib
          lock = tomllib.load(open("upstream.lock", "rb"))
          print(lock["python"]["image"], lock["python"]["pillow"], lock["devkitarm"]["image"])
          EOF
          )
          echo "python=$PY_IMAGE pillow=$PILLOW devkitarm=$DKA_IMAGE"
          docker build -t emerald3ds-release-env \
            --build-arg PYTHON_IMAGE="$PY_IMAGE" \
            --build-arg DEVKITARM_IMAGE="$DKA_IMAGE" \
            --build-arg PILLOW="$PILLOW" tools/release_env

      - name: Source tree
        run: python3 tools/bootstrap.py

      - name: Build the engine-only 3DSX
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD/build/upstream" -e HOME=/tmp emerald3ds-release-env \
            bash -c "set -e; make -j4 tools; make -j4 generated; \
                     make -C 3ds_port -j4 release PYTHON=python3 PORT_LANG=en"
          sudo chown -R "$(id -u):$(id -g)" build
          ls -l build/upstream/3ds_port/dist/

      # The inputs a data pack recipe for this executable is made from
      # (tools/gen_recipe.py): the build's game-data staging, its ELFs and the
      # original game's ELF, rebuilt from the pinned decomp and checked
      # against the supported ROM's SHA-1 (no ROM involved). They hold game
      # data, so they leave the runner only encrypted to the public key in
      # .github/pack-inputs.pub.pem; the recipe is made where that key's
      # private half and the player's own ROM are.
      - name: Original game ELF
        run: |
          read EMERALD_REPO EMERALD_COMMIT AGBCC_REPO AGBCC_COMMIT ROM_SHA1 < <(python3 - <<'EOF'
          import tomllib
          lock = tomllib.load(open("upstream.lock", "rb"))
          print(lock["pokeemerald"]["repository"], lock["pokeemerald"]["commit"],
                lock["agbcc"]["repository"], lock["agbcc"]["commit"], lock["rom"]["sha1"])
          EOF
          )
          for pair in "pokeemerald $EMERALD_REPO $EMERALD_COMMIT" "agbcc $AGBCC_REPO $AGBCC_COMMIT"; do
            set -- $pair
            git init -q "gba/$1"
            git -C "gba/$1" fetch -q --depth 1 "$2" "$3"
            git -C "gba/$1" checkout -q --detach FETCH_HEAD
          done
          docker run --rm -v "$PWD/gba:/gba" -e HOME=/tmp emerald3ds-release-env bash -c \
            "set -e; cd /gba/agbcc && ./build.sh && ./install.sh /gba/pokeemerald && \
             cd /gba/pokeemerald && make -j4 tools && make -j4"
          sudo chown -R "$(id -u):$(id -g)" gba
          test "$(sha1sum gba/pokeemerald/pokeemerald.gba | cut -d' ' -f1)" = "$ROM_SHA1"

      - name: Encrypted recipe inputs
        run: |
          P=build/upstream/3ds_port
          mkdir -p inputs/build inputs/dist
          cp -r "$P/romfs" inputs/romfs
          cp "$P"/dist/Emerald3DS.3dsx "$P"/dist/Emerald3DS.smdh inputs/dist/
          cp "$P/build/gamedata_image.map" inputs/build/
          strip_debug() {
            docker run --rm -v "$PWD:$PWD" -w "$PWD" emerald3ds-release-env arm-none-eabi-objcopy --strip-debug "$1" "$2"
          }
          strip_debug "$P/emerald3ds.elf" inputs/emerald3ds.elf
          strip_debug "$P/build/gamedata_image.elf" inputs/build/gamedata_image.elf
          strip_debug gba/pokeemerald/pokeemerald.elf inputs/pokeemerald.elf
          sudo chown -R "$(id -u):$(id -g)" inputs
          # The voxel generators' inputs as this build's tree has them (the
          # recipe finds each in the ROM; the set must be the build's own).
          python3 - <<'EOF'
          import shutil, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import vtree_manifest
          root, out = Path("build/upstream"), Path("inputs/decomp")
          files = vtree_manifest.binary_inputs(root)
          files += [f + ".lz" for f in files if (root / (f + ".lz")).exists()]
          for rel in files:
              (out / rel).parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(root / rel, out / rel)
          (out / "binary_inputs.txt").write_text("\n".join(files) + "\n")
          print("voxel inputs:", len(files))
          EOF
          tar -C inputs -cf - . | xz -T0 -6 > inputs.tar.xz
          openssl rand -out inputs.key 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:inputs.key -in inputs.tar.xz -out recipe-inputs.tar.xz.enc
          openssl pkeyutl -encrypt -pubin -inkey .github/pack-inputs.pub.pem \
            -pkeyopt rsa_padding_mode:oaep -in inputs.key -out recipe-inputs.key.enc
          rm -f inputs.key inputs.tar.xz
          rm -rf inputs
          ls -l recipe-inputs.*

      - name: Data ABI against the official release
        id: abi
        run: |
          ours=$(python3 -c "import struct,sys; print('%08x' % struct.unpack('<I', open(sys.argv[1],'rb').read(4))[0])" \
                 build/upstream/3ds_port/romfs/engine/abi.bin)
          echo "ours=$ours" >> "$GITHUB_OUTPUT"
          theirs=""
          if curl -fsSL -o official-manifest.json \
               "https://github.com/$UPSTREAM/releases/download/$BASE_RELEASE/web-manifest.json"; then
            theirs=$(python3 -c "import json; print(json.load(open('official-manifest.json')).get('dataAbi',''))")
          fi
          echo "theirs=$theirs" >> "$GITHUB_OUTPUT"
          echo "This build's data ABI: $ours; official $BASE_RELEASE: ${theirs:-unknown}"

      - name: Audit the files that ship
        run: |
          mkdir -p ship
          cp build/upstream/3ds_port/dist/Emerald3DS.3dsx build/upstream/3ds_port/dist/Emerald3DS.smdh ship/
          python3 -c "import zipfile,pathlib; z=zipfile.ZipFile('ship.zip','w'); [z.write(p, 'payload/' + p.name) for p in pathlib.Path('ship').iterdir()]"
          python3 tools/release_audit.py --zip ship.zip --strict
          (cd ship && sha256sum Emerald3DS.3dsx Emerald3DS.smdh > SHA256SUMS.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          OURS: ${{ steps.abi.outputs.ours }}
          THEIRS: ${{ steps.abi.outputs.theirs }}
        run: |
          tag="single-screen-${GITHUB_SHA::7}"
          if [ -n "$THEIRS" ] && [ "$OURS" = "$THEIRS" ]; then
            pak="Its data ABI ($OURS) matches the official $BASE_RELEASE release: an emerald3ds.pak made for $BASE_RELEASE (emerald-3ds.com) works with it unchanged."
          elif [ -n "$THEIRS" ]; then
            pak="It needs an emerald3ds.pak made for this build (data ABI $OURS): a pack made for the official $BASE_RELEASE ($THEIRS) is refused, with an error and nothing else changed."
          else
            pak="Its data ABI is $OURS; the official $BASE_RELEASE manifest could not be read to compare."
          fi
          cat > notes.md <<EOF
          Emerald 3DS $BASE_RELEASE with **SINGLE SCREEN** (OPTIONS > GENERAL > INTERFACE): the bottom screen's menus on the top screen when needed, and battles with the game's own menus in the text box, as on the GBA. See docs/SINGLE_SCREEN.md.

          **Install:** back up \`emerald3ds.sav\` and the \`emerald3ds.clock\` files, and use this fork's installer (the \`steam-deck-installer-…\` release) with your own ROM: it writes this executable with the data pack made for it. This release is the executable alone, for developers.

          $pak

          Engine only: no game data and no ROM content. Unofficial build of commit ${GITHUB_SHA::7}, not from the Emerald 3DS developer.
          EOF
          gh release create "$tag" ship/Emerald3DS.3dsx ship/Emerald3DS.smdh ship/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Game engine only, for developers (${GITHUB_SHA::7})" --notes-file notes.md --latest=false
          # The recipe inputs, encrypted (see "Encrypted recipe inputs"): a
          # prerelease of their own, deleted once fetched.
          gh release create "recipe-inputs-${GITHUB_SHA::7}" recipe-inputs.tar.xz.enc recipe-inputs.key.enc \
            --target "$GITHUB_SHA" --prerelease --title "Recipe inputs ${GITHUB_SHA::7} (encrypted, temporary)" \
            --notes "Encrypted build inputs for making this build's data pack recipe. Not for use; removed soon."
